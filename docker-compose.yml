services:
  bot:
    build: .
    container_name: notiasis-bot
    ports:
      - 8000
    environment:
      # Meta / WhatsApp
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}
      - VERIFY_TOKEN=${VERIFY_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:3001}
      - BACKEND_API_KEY=${BACKEND_API_KEY}
      - ALLOWED_SENDER_NUMBERS=${ALLOWED_SENDER_NUMBERS:-}
      - DEBUG_NOTIFICATION_NUMBER=${DEBUG_NOTIFICATION_NUMBER:-}
      - NOTIFICATION_OVERRIDE_NUMBER=${NOTIFICATION_OVERRIDE_NUMBER:-}
      - DROPI_N8N_URL=${DROPI_N8N_URL:-}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - AI_AGENTS_URL=${AI_AGENTS_URL:-http://ai-agents:3002}
      - AI_AGENTS_API_KEY=${AI_AGENTS_API_KEY:-}
    volumes:
      # Videos de producto: {MEDIA_HOST_DIR}/business/{id}/products/*.mp4
      - ${MEDIA_HOST_DIR:-/home/debian/vicky-v/media}:/data/media:ro
      # Caché de media_id de WhatsApp (sobrevive a reinicios y deploys).
      - bot-state:/data/state
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./webapp/backend
    container_name: notiasis-backend
    ports:
      - 3001
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}
      - JWT_SECRET=${JWT_SECRET}
      - MESSAGING_LIMIT=${MESSAGING_LIMIT:-230}
      - MESSAGING_TRACKING_LIMIT=${MESSAGING_TRACKING_LIMIT:-80}
      - PORT=3001
    restart: unless-stopped

  ai-agents:
    build: ./ai-agents
    container_name: notiasis-ai-agents
    ports:
      - 3002
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AI_AGENTS_API_KEY=${AI_AGENTS_API_KEY}
      - DATABASE_MAX_CONNECTIONS=${DATABASE_MAX_CONNECTIONS:-}
      - RUST_LOG=${RUST_LOG:-info}
      # DeepSeek (chat del agente)
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-}
      - DEEPSEEK_THINKING=${DEEPSEEK_THINKING:-}
      - DEEPSEEK_REASONING_EFFORT=${DEEPSEEK_REASONING_EFFORT:-}
      - DEEPSEEK_MAX_TOKENS=${DEEPSEEK_MAX_TOKENS:-}
      - DEEPSEEK_TIMEOUT_SECS=${DEEPSEEK_TIMEOUT_SECS:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-}
      # Gemini 3.5 Transcribe (notas de voz)
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - GEMINI_TRANSCRIBE_MODEL=${GEMINI_TRANSCRIBE_MODEL:-}
      - GEMINI_TRANSCRIBE_LANGUAGES=${GEMINI_TRANSCRIBE_LANGUAGES:-}
      - GEMINI_TRANSCRIBE_MODE=${GEMINI_TRANSCRIBE_MODE:-}
      - GEMINI_TIMEOUT_SECS=${GEMINI_TIMEOUT_SECS:-}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-}
      # Backend (api_key propia de ai-agents en la tabla api_keys, no la del bot)
      - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:3001}
      - BACKEND_API_KEY=${AI_AGENTS_BACKEND_API_KEY}
      - BACKEND_TIMEOUT_SECS=${BACKEND_TIMEOUT_SECS:-}
      # Dropi (webhooks de N8N, estado en vivo)
      - N8N_API_KEY=${N8N_API_KEY}
      - DROPI_N8N_URL=${DROPI_N8N_URL:-}
      - DROPI_TIMEOUT_SECS=${DROPI_TIMEOUT_SECS:-}
      # Agente de atención al cliente
      - CUSTOMER_AGENT_DRY_RUN=${CUSTOMER_AGENT_DRY_RUN:-false}
      - CUSTOMER_AGENT_ALLOWED_PHONES=${CUSTOMER_AGENT_ALLOWED_PHONES:-}
      - CUSTOMER_AGENT_QUIET_SECONDS=${CUSTOMER_AGENT_QUIET_SECONDS:-}
      - CUSTOMER_AGENT_MAX_REPLIES_PER_HOUR=${CUSTOMER_AGENT_MAX_REPLIES_PER_HOUR:-}
      - CUSTOMER_AGENT_ESCALATION_QUIET_HOURS=${CUSTOMER_AGENT_ESCALATION_QUIET_HOURS:-}
      - CUSTOMER_AGENT_HISTORY_LIMIT=${CUSTOMER_AGENT_HISTORY_LIMIT:-}
      - CUSTOMER_AGENT_GUIDE_LIMIT=${CUSTOMER_AGENT_GUIDE_LIMIT:-}
      - CUSTOMER_AGENT_MAX_TOOL_ROUNDS=${CUSTOMER_AGENT_MAX_TOOL_ROUNDS:-}
      - CUSTOMER_AGENT_MAX_CONCURRENT_TURNS=${CUSTOMER_AGENT_MAX_CONCURRENT_TURNS:-}
      - CUSTOMER_AGENT_MAX_VOICE_NOTES=${CUSTOMER_AGENT_MAX_VOICE_NOTES:-}
      - CUSTOMER_AGENT_VOCABULARY=${CUSTOMER_AGENT_VOCABULARY:-}
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./webapp/frontend
    container_name: notiasis-frontend
    ports:
      - 3000
    environment:
      - BACKEND_URL=${BACKEND_API_URL}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  bot-state:
