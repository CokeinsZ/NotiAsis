services:
  bot:
    build: .
    container_name: notiasis-bot
    ports:
      - 8000
    environment:
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}
      - VERIFY_TOKEN=${VERIFY_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - BACKEND_API_URL=http://backend:3000
      - DEBUG_NOTIFICATION_NUMBER=${DEBUG_NOTIFICATION_NUMBER:-}
      - NOTIFICATION_OVERRIDE_NUMBER=${NOTIFICATION_OVERRIDE_NUMBER:-}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./webapp/backend
    container_name: notiasis-backend
    ports:
      - 3001
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}
      - PORT=3001
    restart: unless-stopped

  frontend:
    build: ./webapp/frontend
    container_name: notiasis-frontend
    ports:
      - 3000
    environment:
      # URL interna del backend (la usa el servidor de Next, no el navegador)
      - BACKEND_URL=http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped
