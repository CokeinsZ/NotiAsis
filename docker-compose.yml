services:
  bot:
    build: .
    container_name: notiasis-bot
    ports:
      - 8000
    environment:
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}
      - VERIFY_TOKEN=${VERIFY_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - BACKEND_API_URL=${BACKEND_API_URL}
      - BACKEND_API_KEY=${BACKEND_API_KEY}
      - DEBUG_NOTIFICATION_NUMBER=${DEBUG_NOTIFICATION_NUMBER:-}
      - NOTIFICATION_OVERRIDE_NUMBER=${NOTIFICATION_OVERRIDE_NUMBER:-}
      - DROPI_N8N_URL=${DROPI_N8N_URL:-}
      - N8N_API_KEY=${N8N_API_KEY:-}
    volumes:
      # Videos de producto: {MEDIA_HOST_DIR}/business/{id}/products/*.mp4
      - ${MEDIA_HOST_DIR:-/home/debian/vicky-v/media}:/data/media:ro
      # Caché de media_id de WhatsApp (sobrevive a reinicios y deploys).
      - bot-state:/data/state
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./webapp/backend
    container_name: notiasis-backend
    ports:
      - 3001
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}
      - JWT_SECRET=${JWT_SECRET}
      - MESSAGING_LIMIT=${MESSAGING_LIMIT:-230}
      - MESSAGING_TRACKING_LIMIT=${MESSAGING_TRACKING_LIMIT:-80}
      - PORT=3001
    restart: unless-stopped

  frontend:
    build: ./webapp/frontend
    container_name: notiasis-frontend
    ports:
      - 3000
    environment:
      - BACKEND_URL=${BACKEND_API_URL}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  bot-state:
