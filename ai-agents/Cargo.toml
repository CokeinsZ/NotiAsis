[package]
name = "ai-agents"
version = "0.1.0"
edition = "2024"
description = "Agentes de IA de NotiAsis (atención al cliente por WhatsApp)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ai-agents"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
reqwest = { version = "0.12", features = ["json"] }
schemars = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
sqlx = { version = "0.9.0", features = ["macros", "postgres", "runtime-tokio", "tls-native-tls", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
